<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Offline Markdown Workbench</title>
    <link rel="stylesheet" href="./css/app.css">
    <link rel="stylesheet" href="./css/themes.css">
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
</head>

<body>
    <div id="app" aria-busy="false"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="drop-overlay" class="drop-overlay" hidden>Markdownファイルをここにドロップ</div>
    <input id="file-input" type="file" accept=".md,.markdown,.mdown,.mkdn,.txt,text/markdown,text/plain" hidden>
    <script src="./vendor/marked.min.js"></script>
    <script src="./vendor/purify.min.js"></script>
    <script src="./vendor/mermaid.min.js"></script>
    <script src="./vendor/highlight.min.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/file-controller.js"></script>
    <script src="./js/markdown-renderer.js"></script>
    <script src="./js/table-controller.js"></script>
    <script src="./js/mermaid-controller.js"></script>
    <script src="./js/toc-controller.js"></script>
    <script src="./js/search-controller.js"></script>
    <script src="./js/theme-controller.js"></script>
    <script src="./js/keyboard-controller.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
